name: Build & Release Flutter Godown Counting App APK

on:
  push:
    branches:
      - main
    paths:
      - 'Godown_Counting_App/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Scaffold Android Support & Scaffolding
        working-directory: ./Godown_Counting_App
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create . --project-name godown_counting_app --org com.maamotors --platforms android
          cp pubspec.backup.yaml pubspec.yaml
          cp google-services.json android/app/google-services.json || true
          cp -r assets/launcher_icons/* android/app/src/main/res/ || true
          flutter pub get

      - name: Build Release APK
        working-directory: ./Godown_Counting_App
        run: flutter build apk --release

      - name: Copy & Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp Godown_Counting_App/build/app/outputs/flutter-apk/app-release.apk release-output/Parts-Challan.apk
          cp Godown_Counting_App/build/app/outputs/flutter-apk/app-release.apk release-output/Maa-Motors-Godown-App.apk

      - name: Upload APK as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parts-Challan-APK
          path: release-output/Parts-Challan.apk
          retention-days: 30

      - name: Update v1.0.0 Release with Latest APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-godown
          name: 'Parts Challan • পার্টস চালান (v1.2.0)'
          body: |
            ## 📱 Parts Challan • পার্টস চালান মোবাইল অ্যাপ v1.2.0

            ### 🌟 নতুন লোগো ও সুবিধাসমূহ:
            * 🎨 **অফিসিয়াল ৩ডি লোগো ও ব্র্যান্ডিং:** Parts Challan অ্যাপ আইকন।
            * 🚪 **আধুনিক ডার্ক নেভিগেশন ড্রয়ার:** টপ বারের মেনু বাটনে ৮টি পূর্ণাঙ্গ মেনু।
            * 🔔 **অডিও বাগ ফিক্স:** গণনা শেষে মিষ্টি সাকসেস চাইম টোন (`complete.wav`)।
            * 🎨 **দোকান হেডিং ও ব্যানার স্টুডিও:** লাইভ WYSIWYG প্রিভিউ সহ নিজস্ব ব্যানার ও কালার ডিজাইন।
            * 🔑 **সোশ্যাল লগইন ও শপ লাইসেন্স পোর্টাল:** Google ও Apple Sign-In, ৮-ডিজিট কোড এবং মাস্টার পিন (`7860`)।
            * 📄 **চালান ও POS প্রিন্ট:** A4 ও ৮০mm থার্মাল রসিদে স্বয়ংক্রিয়ভাবে নিজস্ব ব্র্যান্ডিং প্রিন্ট।
            * 📦 **৬০৯+ পার্টস ক্যাটালগ ও ১-১০০০ স্টুডিও অডিও কাউন্টিং।**

            ---
            ### 📥 ডাউনলোডের নিয়ম:
            নিচের **`Parts-Challan.apk`** বা **`Maa-Motors-Godown-App.apk`** লিংকে ক্লিক করে ফোনে ইনস্টল করুন!
          files: |
            release-output/Parts-Challan.apk
            release-output/Maa-Motors-Godown-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New v1.2.0 Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0-godown
          name: 'Parts Challan (Official Release v1.2.0)'
          body: |
            ## 📱 Parts Challan — Smart Warehouse POS & Digital Challan App

            ### Official Release v1.2.0:
            * 🌟 New 3D Brand Logo & App Icon
            * 🚪 Modern Dark Navigation Drawer
            * 🔔 Completion Chime Audio Tone
            * 🎨 Shop Heading & Banner Studio (WYSIWYG Live Preview)
            * 🔑 Google & Apple Sign-In + 8-char Shop Activation Code + Master PIN
            * 🖨️ A4 & 80mm Bluetooth Thermal POS Receipt Custom Branding
          files: |
            release-output/Parts-Challan.apk
            release-output/Maa-Motors-Godown-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
